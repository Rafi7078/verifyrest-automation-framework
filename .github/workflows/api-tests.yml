name: VerifyREST API Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    name: Run Newman API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run VerifyREST API tests
        run: |
          npx newman run postman/collections/VerifyREST.postman_collection.json \
            --env-var "baseUrl=https://restful-booker.herokuapp.com" \
            --env-var "authUsername=${{ secrets.AUTH_USERNAME }}" \
            --env-var "authPassword=${{ secrets.AUTH_PASSWORD }}" \
            --env-var "token=" \
            --env-var "bookingId="
